name: eBay scan

# Timing comes from Supabase (pg_cron): it triggers "scan" every 10 minutes and
# "digest" at 09:40 UTC. GitHub's own scheduler proved unreliable, so it isn't used.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [scan, digest, test]
        default: scan

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency: ebay-bot-${{ inputs.mode || 'scan' }}   # never two of the same kind at once
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DAILY_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_LOG_WEBHOOK_URL }}
      DISCORD_USAGE_WEBHOOK_URL: ${{ secrets.DISCORD_USAGE_WEBHOOK_URL }}
      MODE: ${{ inputs.mode || 'scan' }}
      HAS_KEYS: ${{ secrets.EBAY_CLIENT_ID != '' }}
    steps:
      - name: Skip until eBay keys are added
        if: env.HAS_KEYS != 'true' && env.MODE != 'test'
        run: echo "eBay keys not set yet - nothing to do."
      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true' || env.MODE == 'test'
      - uses: actions/setup-python@v5
        if: env.HAS_KEYS == 'true' || env.MODE == 'test'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: env.HAS_KEYS == 'true' || env.MODE == 'test'
      - run: python scanner.py --${{ env.MODE }}
        if: env.HAS_KEYS == 'true' || env.MODE == 'test'
